# The scheduled recompute. This is the entire infrastructure of the corpus:
# reports arrive as pull requests, this runs over them, and the result is
# committed. No server, no database, no privacy policy — and if it fails it
# fails as a stale file in a repository rather than as an outage.
name: aggregate

on:
  schedule:
    - cron: "0 3 1 * *"   # monthly, the same grain the reports use
  workflow_dispatch:

jobs:
  recompute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Pinned to a COMMIT rather than a branch: the aggregate is a published
      # figure and must not change because the tool changed underneath it. A
      # commit rather than a tag because the tool has no tags yet, and a
      # workflow pinned to a tag that does not exist is a control that cannot
      # run — it would have failed on its first scheduled attempt, silently,
      # in a repository nobody was watching. Move this to a tag when one exists.
      - run: cargo install --git https://github.com/george-andrikopoulos/relearn --rev 1735e60dcf510beb83e28eac30e5eb272d834dc0 relearn
      - name: recompute
        run: relearn aggregate --clone . --generated "$(date -u +%Y-%m)" --confirm
      - name: commit if it moved
        run: |
          git config user.name  "aggregate"
          git config user.email "aggregate@users.noreply.github.com"
          git add aggregate.toml
          git diff --cached --quiet || git commit -m "chore(aggregate): recompute $(date -u +%Y-%m)"
          git push
